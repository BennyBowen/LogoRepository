<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d5c75"/>
      <stop offset="100%" stop-color="#0a3d52"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4b03e"/>
      <stop offset="100%" stop-color="#d98a1f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6a53c"/>
      <stop offset="100%" stop-color="#c78a2b"/>
    </linearGradient>
  </defs>

  <!-- outer ring -->
  <circle cx="300" cy="300" r="280" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="300" cy="300" r="264" fill="none" stroke="#0a3d52" stroke-width="2"/>

  <!-- main disc -->
  <circle cx="300" cy="300" r="256" fill="url(#sea)"/>

  <!-- sun -->
  <circle cx="300" cy="230" r="70" fill="url(#sun)"/>

  <!-- sun rays -->
  <g stroke="#f4b03e" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="300" y1="130" x2="300" y2="150"/>
    <line x1="220" y1="160" x2="235" y2="175"/>
    <line x1="380" y1="160" x2="365" y2="175"/>
  </g>

  <!-- waves -->
  <g fill="none" stroke="#eef6f8" stroke-width="8" stroke-linecap="round" opacity="0.9">
    <path d="M 70 330 Q 130 305 190 330 T 310 330 T 430 330 T 530 330"/>
    <path d="M 70 370 Q 130 345 190 370 T 310 370 T 430 370 T 530 370" opacity="0.7"/>
    <path d="M 70 410 Q 130 385 190 410 T 310 410 T 430 410 T 530 410" opacity="0.5"/>
  </g>

  <!-- stylised mango leaves either side -->
  <g fill="#3e8a4f">
    <path d="M 150 300 C 110 280 95 240 105 205 C 140 220 165 250 160 300 Z"/>
    <path d="M 450 300 C 490 280 505 240 495 205 C 460 220 435 250 440 300 Z"/>
  </g>

  <!-- banner -->
  <path d="M 90 460 L 510 460 L 480 500 L 120 500 Z" fill="url(#gold)" stroke="#0a3d52" stroke-width="2"/>

  <!-- text: council name -->
  <text x="300" y="404" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#f4f1e8" letter-spacing="2">BOWEN</text>
  <text x="300" y="432" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#f4f1e8" letter-spacing="4">BOROUGH COUNCIL</text>

  <!-- motto/date on banner -->
  <text x="300" y="486" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#0a3d52" letter-spacing="3">SERVING OUR COMMUNITY</text>
</svg>
